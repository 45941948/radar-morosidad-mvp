<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MVP · Scoring preventivo de morosidad</title>
<style>
:root{--bg:#fff;--card:#fff;--ink:#070e46;--mut:#5a6482;--line:#e3e8ef;--navy:#070e46;--blue:#1973b8;--sky:#5bbeff;--red:#da3851;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:15px/1.5 Calibri,Arial,sans-serif}
.top{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:12px 24px;border-bottom:1px solid var(--line);background:#fff}
.prod{display:flex;align-items:center;gap:10px;padding-left:18px;border-left:1px solid var(--line)}.prod b{display:block;line-height:1.1;font:700 16px Arial,sans-serif}.prod small{color:var(--mut);font-size:12px}
#nv{margin-left:auto;display:flex;flex-wrap:wrap}
#nv button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:10px 14px;font-weight:700;color:var(--ink)}#nv button.on{border-color:var(--blue);color:var(--blue)}
.ban{background:#eaf3fb;color:var(--navy);padding:8px 20px;font-size:13px;text-align:center;border-bottom:1px solid #d6e6f5}
main{max-width:1200px;margin:0 auto;padding:22px 20px 40px}
button,select,input,textarea{font:inherit;color:var(--ink);background:#fff;border:1px solid #cfd8e3;border-radius:10px;padding:8px 14px}
button{cursor:pointer;border-radius:99px;font-weight:600}.pri{background:var(--blue);color:#fff;border-color:var(--blue)}.pri:hover{background:#0f5a96}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 2px 10px rgba(7,14,70,.05)}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.kpi{color:var(--mut);font-size:13px}.kpi b{display:block;font:700 30px Arial,sans-serif;color:var(--blue)}
h2{font:700 17px Arial,sans-serif;margin:0 0 10px;color:var(--navy)}.mut{color:var(--mut);font-size:13px}.mt{margin-top:16px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mut);font-size:12px;text-transform:uppercase}th,td{padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
tr.r{cursor:pointer}tr.r:hover{background:#f2f8fe}
.pill{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;color:#070e46}
.L0{background:#2dcccd}.L1{background:#5bbeff}.L2{background:#f8cd51}.L3{background:#da3851;color:#fff}
.bar{height:8px;border-radius:4px;background:#e8eef5;overflow:hidden;min-width:70px}.bar i{display:block;height:100%;background:var(--blue)}
.stk{display:flex;height:30px;border-radius:8px;overflow:hidden;font-size:12px;font-weight:700;color:#070e46}.stk span{display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap}
.fl{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.cm{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;align-items:center;text-align:center}.cm div.c{padding:16px 6px;border-radius:10px;font-size:24px;font-weight:700}.cm small{display:block;font-size:12px;font-weight:400}
.ov{position:fixed;inset:0;background:rgba(7,14,70,.45);z-index:4}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(450px,100%);background:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 24px;overflow:auto;z-index:5}
.fb{display:flex;height:9px;background:#e8eef5;border-radius:5px;overflow:hidden}.fb .h{flex:1;display:flex}.fb i{display:block;height:100%}
.mod{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,92%);background:#fff;border-radius:14px;padding:18px;z-index:5}
textarea{width:100%;height:200px;font:12px monospace}.err{color:var(--red);font-size:13px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center;padding:8px 0}
.eb{color:var(--blue);font-weight:700;letter-spacing:.12em;font-size:12px;text-transform:uppercase}
.hero h1{font:700 46px/1.08 Arial,sans-serif;color:var(--navy);margin:10px 0 14px}.lead{font-size:18px;color:var(--mut);max-width:520px}
.rw{text-align:center}.radar{width:100%;max-width:400px}
.lg{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:6px 0;font-size:13px;font-weight:700}.dt{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.sw{animation:sp 4s linear infinite}.pg{transform-box:fill-box;transform-origin:center;animation:pg 2s ease-out infinite}
@keyframes sp{to{transform:rotate(360deg)}}@keyframes pg{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.4);opacity:0}}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}.hero,.grid,.card{animation:fi .45s ease both}
.step b{font:700 28px Arial,sans-serif;color:#cfe3f5}.step h2{margin:2px 0 6px}
@media(max-width:820px){.hero{grid-template-columns:1fr}.hero h1{font-size:32px}#nv{margin-left:0}}
@media(prefers-reduced-motion:reduce){.sw,.pg,.hero,.grid,.card{animation:none}}
</style></head><body>

const lvl=p=>p<=.3?0:p<=.6?1:p<=.85?2:3;
let seed=11;const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};

const pick=a=>a[Math.floor(rnd()*a.length)];
const D=[];for(let i=0;i<1500;i++)D.push({id:"C-"+(1000+i),seg:pick(SEG),zon:pick(ZON),gen:pick(GEN),eda:pick(EDA),x:{atraso:rnd()<.6?0:Math.round(1+rnd()*rnd()*89),util:.05+.95*Math.pow(rnd(),1.2),saldo:nrm()*.2,buro:Math.round(rnd()*rnd()*7),antig:Math.round(3+rnd()*117),cuota:.05+rnd()*.5,dig:rnd(),prod:1+Math.floor(rnd()*6)}});
const M={},S={};FT.forEach(([k])=>{const v=D.map(d=>d.x[k]),m=v.reduce((a,b)=>a+b)/v.length;M[k]=m;S[k]=Math.sqrt(v.reduce((a,b)=>a+(b-m)**2,0)/v.length)||1});

const cm=(a,t)=>{let tp=0,fp=0,fn=0,tn=0;a.forEach(d=>{const q=d.p>=t;d.y?(q?tp++:fn++):(q?fp++:tn++)});return{tp,fp,fn,tn}};
const mt=c=>{const pr=div(c.tp,c.tp+c.fp),rc=div(c.tp,c.tp+c.fn);return{pr,rc,f1:div(2*pr*rc,pr+rc),fpr:div(c.fp,c.fp+c.tn),acc:div(c.tp+c.tn,D.length&&c.tp+c.fp+c.fn+c.tn)}};
const ROC=[];for(let i=100;i>=0;i--){const c=cm(D,i/100);ROC.push([div(c.fp,c.fp+c.tn),div(c.tp,c.tp+c.fn)])}
let AUC=0;for(let i=1;i<ROC.length;i++)AUC+=(ROC[i][0]-ROC[i-1][0])*(ROC[i][1]+ROC[i-1][1])/2;
const KS=Math.max(...ROC.map(r=>r[1]-r[0]));
const imp=FT.map((f,i)=>D.reduce((a,d)=>a+Math.abs(d.c[i]),0)),it=imp.reduce((a,b)=>a+b);
let st={tab:"radar",seg:"",zon:"",niv:"",q:"",thr:.5,sel:null,exp:""},LOG=[];
try{LOG=JSON.parse(localStorage.getItem("mvp_log")||"[]")}catch(e){}
const save=()=>{try{localStorage.setItem("mvp_log",JSON.stringify(LOG))}catch(e){}};
const $=s=>document.querySelector(s),pc=v=>(v*100).toFixed(0)+"%",f2=v=>v.toFixed(2);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const done=id=>LOG.find(l=>l.id===id);
const topF=d=>{let j=0;d.c.forEach((v,i)=>{if(v>d.c[j])j=i});return FT[j][1]};
const fmt=(k,v)=>k==="atraso"?v+" d":k==="antig"?v+" m":k==="buro"||k==="prod"?v:k==="saldo"?(v>=0?"+":"")+pc(v):pc(v);
const pill=l=>`<span class="pill L${l}">${LV[l]}</span>`;
const flt=()=>D.filter(d=>(!st.seg||d.seg===st.seg)&&(!st.zon||d.zon===st.zon)&&(st.niv===""||lvl(d.p)==st.niv)&&(!st.q||d.id.toLowerCase().includes(st.q.toLowerCase()))).sort((a,b)=>b.p-a.p);
const opt=(a,v)=>a.map(x=>`<option ${x===v?"selected":""}>${x}</option>`).join("");
function vCartera(){const f=flt(),n=f.length,mk=f.filter(d=>d.p>=st.thr).length,ac=f.filter(d=>lvl(d.p)>=2).length,av=n?f.reduce((a,d)=>a+d.p,0)/n:0,dist=[0,1,2,3].map(l=>f.filter(d=>lvl(d.p)==l).length);
return `<div class="grid g4"><div class="card kpi">Clientes en la vista<b>${n}</b></div><div class="card kpi">Marcados (score ≥ ${f2(st.thr)})<b>${mk}</b></div><div class="card kpi">Riesgo alto o crítico<b>${n?pc(ac/n):"–"}</b></div><div class="card kpi">Score medio<b>${f2(av)}</b></div></div>
<div class="card mt"><h2>Distribución por nivel de riesgo</h2><div class="stk">${dist.map((c,l)=>c?`<span class="L${l}" style="flex:${c}">${LV[l]} · ${c}</span>`:"").join("")}</div></div>
<div class="card mt"><h2>Lista priorizada para gestores</h2><div class="fl"><select id="fs"><option value="">Todos los segmentos</option>${opt(SEG,st.seg)}</select><select id="fz"><option value="">Todas las zonas</option>${opt(ZON,st.zon)}</select><select id="fn"><option value="">Todos los niveles</option>${LV.map((x,i)=>`<option value="${i}" ${st.niv===String(i)?"selected":""}>${x}</option>`).join("")}</select><input id="fq" type="search" placeholder="Buscar ID (ej. C-1020)" value="${esc(st.q)}"><button data-x="exp">Exportar lista</button></div>
<div class="tw"><table><tr><th>ID</th><th>Segmento</th><th>Zona</th><th>Score</th><th>Nivel</th><th>Factor principal</th><th>Estado</th></tr>${f.slice(0,40).map(d=>{const g=done(d.id);return `<tr class="r" data-id="${d.id}"><td><b>${d.id}</b></td><td>${d.seg}</td><td>${d.zon}</td><td><div style="display:flex;gap:8px;align-items:center"><div class="bar" style="width:70px"><i style="width:${d.p*100}%"></i></div>${f2(d.p)}</div></td><td>${pill(lvl(d.p))}</td><td>${topF(d)}</td><td>${g?g.dec:"<span class=mut>Pendiente</span>"}</td></tr>`}).join("")}</table></div>
<p class="mut">Se muestran los 40 casos de mayor score de ${n}. Selecciona un cliente para ver factores, historial y registrar la decisión humana.</p></div>`}
function vModelo(){const c=cm(D,st.thr),m=mt(c),pts=ROC.map(r=>`${20+r[0]*190},${200-r[1]*180}`).join(" "),cur=[div(c.fp,c.fp+c.tn),div(c.tp,c.tp+c.fn)];
const kp=[["AUC ROC",f2(AUC)],["KS",f2(KS)],["Precisión",f2(m.pr)],["Recall",f2(m.rc)],["F1",f2(m.f1)],["Exactitud",f2(m.acc)]];
return `<div class="card"><h2>Umbral de decisión: <span id="thv">${f2(st.thr)}</span></h2><input id="th" type="range" min="0.1" max="0.9" step="0.01" value="${st.thr}" style="width:100%;padding:0"><p class="mut">Un falso negativo (cliente en riesgo no detectado) y un falso positivo (contacto innecesario) tienen costos distintos en cobranzas: el umbral se define con negocio, no solo maximizando F1.</p></div>
<div class="grid g4 mt">${kp.map(([a,b])=>`<div class="card kpi">${a}<b>${b}</b></div>`).join("")}</div>
<div class="grid g2 mt"><div class="card"><h2>Matriz de confusión · n = ${D.length}</h2><div class="cm"><span></span><span class="mut">Pred. No moroso</span><span class="mut">Pred. Moroso</span><span class="mut">Real No moroso</span><div class="c L0">${c.tn}<small>TN</small></div><div class="c L2">${c.fp}<small>FP</small></div><span class="mut">Real Moroso</span><div class="c L2">${c.fn}<small>FN</small></div><div class="c L1">${c.tp}<small>TP</small></div></div></div>
<div class="card"><h2>Curva ROC</h2><svg viewBox="0 0 230 220" style="width:100%;max-width:340px"><rect x="20" y="20" width="190" height="180" fill="none" stroke="var(--line)"/><line x1="20" y1="200" x2="210" y2="20" stroke="var(--mut)" stroke-dasharray="4"/><polyline fill="none" stroke="var(--blue)" stroke-width="2.5" points="${pts}"/><circle cx="${20+cur[0]*190}" cy="${200-cur[1]*180}" r="5" fill="var(--red)"/><text x="115" y="216" font-size="10" text-anchor="middle" fill="var(--mut)">Tasa de falsos positivos</text></svg><p class="mut">El punto rojo marca el umbral elegido.</p></div></div>
<div class="card mt"><h2>Factores explicativos (importancia global)</h2>${FT.map((f,i)=>[f[1],imp[i]/it]).sort((a,b)=>b[1]-a[1]).map(([n,v])=>`<div style="display:grid;grid-template-columns:minmax(150px,230px) 1fr 44px;gap:10px;align-items:center;margin:6px 0"><span>${n}</span><div class="bar"><i style="width:${v*100/0.3}%"></i></div><b>${pc(v)}</b></div>`).join("")}<p class="mut">MVP: puntuación con un modelo logístico simulado y contribuciones aditivas por cliente (tipo SHAP). En el piloto se sustituye por XGBoost + SHAP; la interfaz y el flujo no cambian.</p></div>`}
function vEquidad(){const DIM=[["Género","gen",GEN],["Rango de edad","eda",EDA],["Zona","zon",ZON]];
return `<div class="card"><h2>Control de sesgo · umbral ${f2(st.thr)}</h2><p class="mut">Criterio US-04: diferencia de tasa de falsos positivos entre grupos menor a 5 pp. El recall por grupo se muestra como referencia.</p></div>`+DIM.map(([t,k,gs])=>{const r=gs.map(g=>{const sub=D.filter(d=>d[k]===g),m=mt(cm(sub,st.thr));return{g,n:sub.length,fpr:m.fpr,rc:m.rc}}),gf=(Math.max(...r.map(x=>x.fpr))-Math.min(...r.map(x=>x.fpr)))*100,gr=(Math.max(...r.map(x=>x.rc))-Math.min(...r.map(x=>x.rc)))*100,ok=gf<5;
return `<div class="card mt"><h2>${t} <span class="pill ${ok?"L0":"L2"}">${ok?"Cumple":"Revisar"} · Δ FPR ${gf.toFixed(1)} pp</span></h2><div class="tw"><table><tr><th>Grupo</th><th>n</th><th>Falsos positivos (FPR)</th><th>Recall</th></tr>${r.map(x=>`<tr><td><b>${x.g}</b></td><td>${x.n}</td><td><div style="display:flex;gap:8px;align-items:center"><div class="bar"><i style="width:${x.fpr*100*3}%"></i></div>${pc(x.fpr)}</div></td><td>${pc(x.rc)}</td></tr>`).join("")}</table></div><p class="mut">Δ recall: ${gr.toFixed(1)} pp.${ok?"":" Plan de mitigación: revisar umbral por grupo o recalibrar antes de producción."}</p></div>`}).join("")}
function vRegistro(){const ok=LOG.filter(l=>l.dec==="Confirmada").length;
return `<div class="grid g4"><div class="card kpi">Decisiones registradas<b>${LOG.length}</b></div><div class="card kpi">Confirmadas<b>${ok}</b></div><div class="card kpi">Recomendación descartada<b>${LOG.length-ok}</b></div></div>
<div class="card mt"><h2>Registro de acciones tomadas (feedback loop)</h2><div class="fl"><button data-x="expl">Exportar registro</button><button data-x="clr">Borrar registro</button></div>${LOG.length?`<div class="tw"><table><tr><th>Fecha</th><th>Cliente</th><th>Score</th><th>Nivel</th><th>Acción</th><th>Decisión</th><th>Gestor</th><th>Nota</th></tr>${LOG.map(l=>`<tr><td>${esc(l.t)}</td><td>${l.id}</td><td>${l.p}</td><td>${pill(l.n)}</td><td>${esc(l.a)}</td><td>${l.dec}</td><td>${esc(l.g)}</td><td>${esc(l.nota)}</td></tr>`).join("")}</table></div>`:`<p class="mut">Aún no hay decisiones. Abre un cliente en Cartera y confirma o descarta la recomendación; el registro alimenta el reentrenamiento futuro.</p>`}</div>`}
function vDrawer(){const d=D.find(x=>x.id===st.sel);if(!d)return"";const l=lvl(d.p),g=done(d.id),ix=d.c.map((v,i)=>i).sort((a,b)=>Math.abs(d.c[b])-Math.abs(d.c[a])).slice(0,5),mx=Math.max(...ix.map(i=>Math.abs(d.c[i])));
return `<div class="ov" data-x="close"></div><aside class="dr"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">${d.id} · ${d.seg} · ${d.zon}</h2><button data-x="close">Cerrar</button></div>
<p style="font-size:34px;font-weight:700;margin:8px 0 0">${f2(d.p)} ${pill(l)}</p><div class="mut">Historial de score (6 meses)</div><svg viewBox="0 0 120 36" width="140" height="42"><polyline fill="none" stroke="var(--blue)" stroke-width="2" points="${d.h.map((v,i)=>`${i*22+5},${33-v*30}`).join(" ")}"/></svg>
<h2 class="mt">Top 5 factores que explican el score</h2>${ix.map(i=>{const v=d.c[i],w=Math.abs(v)/mx*100;return `<div style="margin:9px 0"><div style="display:flex;justify-content:space-between;font-size:13px"><span>${FT[i][1]}</span><b>${fmt(FT[i][0],d.x[FT[i][0]])} · ${v>0?"+":""}${f2(v)}</b></div><div class="fb"><span class="h" style="justify-content:flex-end">${v<0?`<i style="width:${w}%;background:var(--blue)"></i>`:""}</span><span class="h">${v>0?`<i style="width:${w}%;background:var(--red)"></i>`:""}</span></div></div>`}).join("")}<div class="mut">Rojo: aumenta el riesgo · Azul: lo reduce</div>
<h2 class="mt">Decisión del gestor</h2>${g?`<div class="card">Registrada: <b>${g.dec}</b> · ${esc(g.a)} · ${esc(g.g)}<br><span class="mut">${esc(g.t)}</span></div>`:`<label class="mut">Acción recomendada para nivel ${LV[l]}</label><select id="ac" style="width:100%;margin:4px 0 10px">${ACT[l].map(a=>`<option>${a}</option>`).join("")}</select><input id="gs" placeholder="Gestor autorizado (nombre)" style="width:100%;margin-bottom:10px"><textarea id="nt" placeholder="Nota (opcional)" style="height:70px;font:inherit"></textarea><p class="err" id="er"></p><div class="fl"><button class="pri" data-x="ok">Confirmar decisión</button><button data-x="no">Descartar recomendación</button></div><p class="mut">El sistema nunca actúa de forma autónoma: sin confirmación humana no se registra ninguna acción.</p>`}</aside>`}
function vExport(){return st.exp?`<div class="ov" data-x="close"></div><div class="mod"><h2>Exportar (CSV)</h2><textarea id="csv" readonly>${esc(st.exp)}</textarea><div class="fl" style="margin:10px 0 0"><button class="pri" data-x="cp">Copiar</button><button data-x="close">Cerrar</button></div></div>`:""}
function radar(){const R=152,sm=D.filter((d,i)=>i%45===0||d.p>.93).slice(0,45),C=["#2dcccd","#1973b8","#f0a800","#da3851"];
const bl=sm.map(d=>{const a=(parseInt(d.id.slice(2))*137.5)%360*Math.PI/180,r=22+(1-d.p)*(R-30),x=(180+r*Math.sin(a)).toFixed(1),y=(180-r*Math.cos(a)).toFixed(1),l=lvl(d.p);return `<g data-id="${d.id}" style="cursor:pointer"><title>${d.id} · score ${f2(d.p)} · ${LV[l]}</title>${l==3?`<circle class="pg" cx="${x}" cy="${y}" r="5" fill="${C[3]}"/>`:""}<circle cx="${x}" cy="${y}" r="${l==3?5.5:4.2}" fill="${C[l]}" stroke="#fff" stroke-width="1.5"/></g>`}).join("");
const lb=[[152,"Bajo"],[113,"Medio"],[74,"Alto"],[42,"Crítico"]].map(([r,n])=>`<text x="186" y="${180-r+11}" font-size="9" fill="#5a6482" font-weight="700">${n}</text>`).join("");
return `<svg class="radar" viewBox="0 0 360 360" role="img" aria-label="Radar animado de clientes por nivel de riesgo"><defs><radialGradient id="rg"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#eef6fd"/></radialGradient></defs><circle cx="180" cy="180" r="172" fill="url(#rg)" stroke="#d6e6f5" stroke-width="2"/><circle cx="180" cy="180" r="152" fill="#2dcccd" fill-opacity=".07" stroke="#b9e7ea"/><circle cx="180" cy="180" r="113" fill="#5bbeff" fill-opacity=".09" stroke="#bcdcf5"/><circle cx="180" cy="180" r="74" fill="#f8cd51" fill-opacity=".16" stroke="#f1dd9a"/><circle cx="180" cy="180" r="42" fill="#da3851" fill-opacity=".13" stroke="#f0b3bc"/><line x1="180" y1="28" x2="180" y2="332" stroke="#cfe0f0"/><line x1="28" y1="180" x2="332" y2="180" stroke="#cfe0f0"/>${lb}<g class="sw" style="transform-origin:180px 180px"><path d="M180 180 L72.5 72.5 A152 152 0 0 1 180 28Z" fill="#1973b8" fill-opacity=".10"/><path d="M180 180 L128 37.2 A152 152 0 0 1 180 28Z" fill="#1973b8" fill-opacity=".22"/><line x1="180" y1="180" x2="180" y2="28" stroke="#1973b8" stroke-width="2"/></g>${bl}<circle cx="180" cy="180" r="4" fill="#070e46"/></svg>`}
function vRadar(){const n=D.length,ac=D.filter(d=>lvl(d.p)>=2).length,cr=D.filter(d=>lvl(d.p)==3).length;
return `<section class="hero"><div><div class="eb">Piloto académico · Scrum + IA</div><h1>Detecta la morosidad antes de que ocurra</h1><p class="lead">Un radar que prioriza a los clientes con riesgo de impago, explica por qué y propone una acción preventiva. El gestor siempre decide.</p><div class="fl mt"><button class="pri" data-tab="cartera">Ver cartera priorizada</button><button data-tab="modelo">Cómo rinde el modelo</button></div></div><div class="rw">${radar()}<div class="lg">${LV.map((x,i)=>`<span><i class="dt L${i}"></i>${x}</span>`).join("")}</div><div class="mut">Cada punto es un cliente ficticio; toca uno para ver su detalle. Más cerca del centro, mayor riesgo.</div></div></section>
<div class="grid g4 mt"><div class="card kpi">Clientes monitoreados<b>${n}</b></div><div class="card kpi">Riesgo alto o crítico<b>${pc(ac/n)}</b></div><div class="card kpi">Casos críticos<b>${cr}</b></div><div class="card kpi">AUC del modelo<b>${f2(AUC)}</b></div></div>
<h2 class="mt">Cómo funciona</h2><div class="grid g4">${[["01","Datos","Cartera ficticia o anonimizada, sin identificadores personales."],["02","Score","Probabilidad de mora entre 0 y 1, con cuatro niveles de riesgo."],["03","Explicación","Los cinco factores que más pesan en cada caso."],["04","Decisión humana","El gestor confirma o descarta la acción y todo queda registrado."]].map(([a,b,c])=>`<div class="card step"><b>${a}</b><h2>${b}</h2><div class="mut">${c}</div></div>`).join("")}</div>
<div class="card mt" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><b>Principios del piloto</b>${["Apoya, no reemplaza, la decisión humana","Privacidad: datos ficticios o anonimizados","Equidad y trazabilidad auditables"].map(x=>`<span class="pill L1">${x}</span>`).join("")}</div>`}
const TABS=[["radar","Radar"],["cartera","Cartera"],["modelo","Modelo"],["equidad","Equidad"],["registro","Registro"]];
function render(){$("#nv").innerHTML=TABS.map(([k,t])=>`<button data-tab="${k}" class="${st.tab===k?"on":""}">${t}</button>`).join("");$("#app").innerHTML=({radar:vRadar,cartera:vCartera,modelo:vModelo,equidad:vEquidad,registro:vRegistro})[st.tab]()+vDrawer()+vExport()+`<p class="mut" style="text-align:center;margin-top:28px">Datos 100 % ficticios · El score apoya, no reemplaza, la decisión humana · Tip: usa ← → para cambiar de sección</p>`}
function decide(x){const g=($("#gs").value||"").trim();if(!g){$("#er").textContent="Indica el gestor autorizado para registrar la decisión.";return}const d=D.find(z=>z.id===st.sel),n=lvl(d.p);LOG.unshift({t:new Date().toLocaleString("es-PE"),id:d.id,p:f2(d.p),n,a:x==="ok"?$("#ac").value:"—",dec:x==="ok"?"Confirmada":"Descartada",g,nota:$("#nt").value.trim()});save();st.sel=null;render()}
const csv=r=>r.map(a=>a.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n");
document.addEventListener("click",e=>{const t=e.target.closest("[data-tab],[data-id],[data-x]");if(!t)return;const d=t.dataset;
if(d.tab){st.tab=d.tab;scrollTo(0,0)}else if(d.id)st.sel=d.id;else if(d.x==="close"){st.sel=null;st.exp=""}
else if(d.x==="ok"||d.x==="no")return decide(d.x);
else if(d.x==="exp")st.exp=csv([["id","segmento","zona","score","nivel","factor_principal","accion_sugerida"],...flt().map(z=>[z.id,z.seg,z.zon,f2(z.p),LV[lvl(z.p)],topF(z),ACT[lvl(z.p)][0]])]);
else if(d.x==="expl")st.exp=csv([["fecha","cliente","score","nivel","accion","decision","gestor","nota"],...LOG.map(l=>[l.t,l.id,l.p,LV[l.n],l.a,l.dec,l.g,l.nota])]);
else if(d.x==="clr"){LOG=[];save()}
else if(d.x==="cp"){const a=$("#csv");a.select();try{navigator.clipboard.writeText(a.value).catch(()=>document.execCommand("copy"));t.textContent="Copiado"}catch(_){try{document.execCommand("copy")}catch(__){}}return}
render()});
document.addEventListener("change",e=>{const i=e.target.id,v=e.target.value;if(i==="fs")st.seg=v;else if(i==="fz")st.zon=v;else if(i==="fn")st.niv=v;else if(i==="th")st.thr=+v;else return;render()});
document.addEventListener("input",e=>{const i=e.target.id;if(i==="th")$("#thv").textContent=(+e.target.value).toFixed(2);else if(i==="fq"){st.q=e.target.value;render();const q=$("#fq");q.focus();q.setSelectionRange(q.value.length,q.value.length)}});
document.addEventListener("keydown",e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||st.sel||st.exp)return;const k=TABS.map(x=>x[0]),i=k.indexOf(st.tab);if(e.key==="ArrowRight")st.tab=k[Math.min(i+1,k.length-1)];else if(e.key==="ArrowLeft")st.tab=k[Math.max(i-1,0)];else return;scrollTo(0,0);render()});
render();
</script></body></html>
